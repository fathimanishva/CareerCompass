{% extends "base.html" %}

{% block title %}500 - Server Error - CareerCompass{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="glass-card p-5 mx-auto my-5" style="max-width: 550px;">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h3 class="fw-bold mb-3">Internal Server Error</h3>
    <p class="text-muted mb-4">Something went wrong while processing your request. Please try again.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary-grad px-4 py-2">
      <i class="fa-solid fa-house me-2"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
