{% extends "base.html" %}

{% block title %}Set New Password - CareerCompass{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5 shadow-lg border-primary border-opacity-25">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-3 mb-3 shadow" style="width: 50px; height: 50px;">
            <i class="fa-solid fa-lock-open fa-xl"></i>
          </div>
          <h3 class="fw-bold text-white">Create New Password</h3>
          <p class="text-muted small">Choose a strong, secure password for your CareerCompass account.</p>
        </div>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-white">New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-white"><i class="fa-solid fa-lock"></i></span>
              <input type="password" name="password" class="form-control form-control-custom text-white" placeholder="Min. 6 characters" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-white">Confirm New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-white"><i class="fa-solid fa-lock"></i></span>
              <input type="password" name="confirm_password" class="form-control form-control-custom text-white" placeholder="Re-enter new password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-grad w-100 py-2 fw-bold shadow">
            <i class="fa-solid fa-check-circle me-2"></i> Update Password & Sign In
          </button>
        </form>

        <div class="text-center mt-4">
          <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none fw-semibold small">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
