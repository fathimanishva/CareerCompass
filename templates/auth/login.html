{% extends "base.html" %}

{% block title %}Sign In - CareerCompass{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5 shadow-lg border-primary border-opacity-25">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-3 mb-3 shadow" style="width: 50px; height: 50px;">
            <i class="fa-solid fa-compass fa-xl"></i>
          </div>
          <h3 class="fw-bold">Welcome Back</h3>
          <p class="text-muted small">Sign in to continue tracking your career roadmap</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-muted"><i class="fa-solid fa-envelope"></i></span>
              <input type="email" name="email" id="emailInput" class="form-control form-control-custom" placeholder="name@example.com" value="{{ email or '' }}" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-semibold text-white mb-0">Password</label>
              <a href="{{ url_for('auth.forgot_password') }}" class="small text-primary text-decoration-none fw-semibold">
                Forgot password?
              </a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-muted"><i class="fa-solid fa-lock"></i></span>
              <input type="password" name="password" id="passwordInput" class="form-control form-control-custom" placeholder="••••••••" required>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
            <label class="form-check-label text-muted small" for="rememberMe">
              Remember me on this device
            </label>
          </div>

          <button type="submit" class="btn btn-primary-grad w-100 py-2 fw-bold shadow">
            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In
          </button>
        </form>

        <div class="mt-4 text-center">
          <span class="text-muted small">Don't have an account yet?</span>
          <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold small ms-1">Create Account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
